name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, staging]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npx tsc --noEmit

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    env:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-secret-placeholder
      GOOGLE_CLIENT_ID: placeholder
      GOOGLE_CLIENT_SECRET: placeholder
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: mujer-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [build]
    env:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-secret-placeholder
      GOOGLE_CLIENT_ID: placeholder
      GOOGLE_CLIENT_SECRET: placeholder
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: mujer-app
      # Public Firebase API key — already hardcoded in firebase.ts, safe to include here.
      # Required by global-setup.ts to create e2e test users in Firebase Auth.
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCcU9HP6ELT0SKyhVXyxMPebE4c5KqTi7g
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      # Los emuladores de Firestore/Auth aíslan el seed de e2e del proyecto
      # real (mujer-app) — build y test corren dentro del wrapper para que
      # el bundle cliente también quede compilado apuntando al emulador
      # (ver next.config.ts).
      - run: npx firebase emulators:exec --project mujer-app --only auth,firestore "npm run build && npx playwright test --reporter=list"
        env:
          CI: true
